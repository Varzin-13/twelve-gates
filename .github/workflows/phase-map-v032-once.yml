name: phase-map-v032-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.32-execution-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run focused theta/power phase-map exploration
        working-directory: simulations
        run: python phase_map_v032.py
      - name: Commit phase-map artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/results/phase_map_v032_results.json docs/PHASE_MAP_V032_2026-09-30.md
          git diff --cached --quiet && exit 0
          git commit -m "results: record v0.32 theta-power phase map"
          git push origin HEAD:research/v0.32-execution-audit
