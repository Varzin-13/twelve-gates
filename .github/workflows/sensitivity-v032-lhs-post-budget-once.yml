name: sensitivity-v032-lhs-post-budget-once

on:
  push:
    branches:
      - research/v0.32-execution-audit
    paths:
      - simulations/sensitivity_v032_lhs_post_budget.py

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.32-execution-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run paired post-budget LHS
        working-directory: simulations
        run: python sensitivity_v032_lhs_post_budget.py
      - name: Commit LHS artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/results/sensitivity_v032_lhs_post_budget_results.json docs/SENSITIVITY_V032_LHS_POST_BUDGET_2026-10-01.md
          git diff --cached --quiet && exit 0
          git commit -m "results: record post-budget LHS sensitivity"
          git pull --rebase origin research/v0.32-execution-audit
          git push origin HEAD:research/v0.32-execution-audit
