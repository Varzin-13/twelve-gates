name: stress-v032-post-numeric-threshold-once

on:
  push:
    branches:
      - research/v0.32-execution-audit
    paths:
      - simulations/run_stress_v032_post_numeric_threshold.py

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run paired post-numeric-threshold stress audit
        working-directory: simulations
        run: python run_stress_v032_post_numeric_threshold.py
      - name: Commit paired audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/results/stress_v032_post_numeric_threshold_results.json docs/STRESS_V032_POST_NUMERIC_THRESHOLD_2026-10-01.md
          git diff --cached --quiet && exit 0
          git commit -m "results: record post-numeric-threshold stress audit"
          git pull --rebase origin research/v0.32-execution-audit
          git push origin HEAD:research/v0.32-execution-audit
