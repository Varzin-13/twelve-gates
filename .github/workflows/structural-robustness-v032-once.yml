name: structural-robustness-v032-once

on:
  pull_request:
    paths:
      - simulations/structural_robustness_v032.py

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.32-execution-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run structural robustness experiment
        working-directory: simulations
        run: python structural_robustness_v032.py
      - name: Commit structural robustness artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/results/structural_robustness_v032_results.json docs/STRUCTURAL_ROBUSTNESS_V032_2026-09-30.md
          git diff --cached --quiet && exit 0
          git commit -m "results: record v0.32 coalition structural robustness"
          git pull --rebase origin research/v0.32-execution-audit
          git push origin HEAD:research/v0.32-execution-audit
