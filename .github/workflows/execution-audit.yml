name: execution-audit

on:
  push:
    branches:
      - research/v0.32-execution-audit
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python sources
        run: python -m compileall -q simulations formal
      - name: Scenario 4 conditional-sensitivity smoke
        working-directory: simulations
        run: python scenario4_guardian_model_deadline.py
      - name: Scenario 5 conditional-sensitivity smoke
        working-directory: simulations
        run: python scenario5_ncri_coalition.py
      - name: Regression tests
        working-directory: simulations
        run: PYTHONDONTWRITEBYTECODE=1 python test_model.py
      - name: Institutional interface tests
        working-directory: simulations
        run: python test_institutional_interfaces.py
      - name: Z12 schedule audit
        working-directory: simulations
        run: python audit_schedule.py
      - name: Calibration registry
        run: python simulations/validate_calibration_registry.py
      - name: Finite-state invariant checks
        run: python formal/abstract_model_check.py
