name: sensitivity-v032-lhs-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v0.32-execution-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run exploratory LHS behavior-space analysis
        working-directory: simulations
        run: python sensitivity_v032_lhs.py
      - name: Commit exploratory result artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/results/sensitivity_v032_lhs_results.json docs/SENSITIVITY_V032_LHS_2026-09-30.md
          git diff --cached --quiet && exit 0
          git commit -m "results: record v0.32 LHS behavior-space exploration"
          git push origin HEAD:research/v0.32-execution-audit
